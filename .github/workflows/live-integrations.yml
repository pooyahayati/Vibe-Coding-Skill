name: Live Integration Contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/dependency_guard.py"
      - "scripts/live_dependency_evals.py"
      - "references/security-and-dependencies.md"
      - ".github/workflows/live-integrations.yml"
  schedule:
    - cron: "41 5 * * 2"

jobs:
  registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Smoke-test registry OSV deps.dev and source-health adapters
        run: python scripts/live_dependency_evals.py

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Contract-test approved Trivy
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["trivy"]["approved"])')
          python scripts/trivy_compat.py --version "$VERSION" --json
