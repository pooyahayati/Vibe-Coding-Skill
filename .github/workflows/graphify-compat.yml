name: Graphify Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/toolchain.json"
      - "scripts/graphify_compat.py"
      - "scripts/toolchain_resolution.py"
      - ".github/workflows/graphify-compat.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Test latest stable Graphify compatibility
        run: python scripts/graphify_compat.py --latest --json | tee graphify-compat.json
      - name: Verify last-known-good fallback
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["graphify"]["last_known_good"])')
          python scripts/graphify_compat.py --version "$VERSION" --json | tee graphify-fallback.json
      - name: Verify resolver policy
        run: python scripts/toolchain_resolution.py graphify --json
