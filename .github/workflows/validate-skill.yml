name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select checks from the checked-out change
        id: scope
        run: python scripts/ci_scope.py plan --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Validate skill structure and portable consistency
        run: |
          python scripts/validate_skill.py
          python scripts/sync_package.py --check
      - name: Validate instruction policy
        if: steps.scope.outputs.policy == 'true'
        run: |
          python scripts/validate_evals.py
          python scripts/run_evals.py
      - name: Compile all scripts for the full baseline
        if: steps.scope.outputs.full == 'true'
        run: |
          python -m py_compile scripts/*.py
      - name: Run selected regression tests
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/ci_scope.py test --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Validate representative projects
        if: steps.scope.outputs.full == 'true'
        run: python scripts/run_project_validations.py
      - name: Run failure injection suite
        if: steps.scope.outputs.full == 'true'
        run: python scripts/run_failure_injections.py
      - name: Check repository purity
        run: python scripts/repository_purity.py --root . --json
      - name: Offline installation check
        if: steps.scope.outputs.runtime == 'true'
        run: python scripts/install_check.py --skill-root . --json
      - name: Portable installation check
        if: steps.scope.outputs.runtime == 'true'
        run: python skills/vibe-coding-skill/scripts/install_check.py --skill-root skills/vibe-coding-skill --json
      - name: Build and verify release ZIP
        if: steps.scope.outputs.full == 'true'
        run: python scripts/build_release.py --output-dir "$RUNNER_TEMP/vibe-release" --json
      - name: Full validation completed
        if: steps.scope.outputs.full == 'true'
        run: echo "Full validation completed for $GITHUB_SHA"
