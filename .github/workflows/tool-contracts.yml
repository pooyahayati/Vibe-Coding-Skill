name: Tool Contract Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/toolchain.json"
      - "scripts/graphify_compat.py"
      - "scripts/trivy_compat.py"
      - ".github/workflows/tool-contracts.yml"

jobs:
  registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Live registry and OSV adapter smoke tests
        run: python scripts/live_dependency_evals.py

  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Contract-test approved Graphify
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["graphify"]["approved"])')
          python scripts/graphify_compat.py --version "$VERSION" --json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Contract-test approved Trivy
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["trivy"]["approved"])')
          python scripts/trivy_compat.py --version "$VERSION" --json
