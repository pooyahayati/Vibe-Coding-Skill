name: Tool Contract Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"
      - "config/toolchain.json"
      - "scripts/dependency_guard.py"
      - "scripts/live_dependency_evals.py"
      - "scripts/graphify_compat.py"
      - "scripts/trivy_compat.py"
      - "scripts/toolchain_resolution.py"
      - "scripts/toolchain_runtime.py"
      - "tests/test_toolchain_resolution.py"
      - "references/security-and-dependencies.md"
      - "references/toolchain-version-resolution.md"
      - ".github/workflows/tool-contracts.yml"
  pull_request:
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"
      - "config/toolchain.json"
      - "scripts/dependency_guard.py"
      - "scripts/live_dependency_evals.py"
      - "scripts/graphify_compat.py"
      - "scripts/trivy_compat.py"
      - "scripts/toolchain_resolution.py"
      - "scripts/toolchain_runtime.py"
      - "tests/test_toolchain_resolution.py"
      - "references/security-and-dependencies.md"
      - "references/toolchain-version-resolution.md"
      - ".github/workflows/tool-contracts.yml"

jobs:
  registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Live registry and OSV adapter smoke tests
        run: python scripts/live_dependency_evals.py

  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Contract-test latest-compatible Graphify
        run: |
          python scripts/toolchain_resolution.py graphify --json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # reviewed v0.2.6
        with:
          version: latest
          cache: false
          path: ${{ runner.temp }}/native-trivy
      - name: Contract-test latest-compatible Trivy
        run: |
          python scripts/toolchain_resolution.py trivy --json
      - name: Native release gate on harmless local fixture
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-fixture"
          echo 'ordinary fixture' > "$RUNNER_TEMP/trivy-fixture/app.txt"
          python scripts/trivy_compat.py --release-target "$RUNNER_TEMP/trivy-fixture" \
            --scanners secret --output "$RUNNER_TEMP/trivy-evidence/report.json" --json
      - name: Native gate on the exact candidate portable ZIP
        run: python scripts/build_release.py --output-dir "$RUNNER_TEMP/vibe-candidate" --before-publication --json
