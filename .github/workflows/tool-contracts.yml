name: Tool Contract Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/toolchain.json"
      - "scripts/graphify_compat.py"
      - "scripts/trivy_compat.py"
      - ".github/workflows/tool-contracts.yml"

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Contract-test approved Graphify
        run: python scripts/graphify_compat.py --version 0.9.64 --json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract-test approved Trivy
        run: python scripts/trivy_compat.py --version 0.74.0 --json
