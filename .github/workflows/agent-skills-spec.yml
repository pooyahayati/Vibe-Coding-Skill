name: Agent Skills Spec Compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - ".github/workflows/**"
      - "scripts/ci_scope.py"
      - "scripts/collect_release_checks.py"
      - "scripts/release_readiness.py"
      - "scripts/build_release.py"
      - "scripts/publish_release.py"
      - "scripts/sync_package.py"
      - "scripts/validate_skill.py"
      - "SKILL.md"
      - "agents/openai.yaml"
      - "plugin.json"
      - "skills/vibe-coding-skill/**"
  pull_request:
    paths:
      - "VERSION"
      - ".github/workflows/**"
      - "scripts/ci_scope.py"
      - "scripts/collect_release_checks.py"
      - "scripts/release_readiness.py"
      - "scripts/build_release.py"
      - "scripts/publish_release.py"
      - "scripts/sync_package.py"
      - "scripts/validate_skill.py"
      - "SKILL.md"
      - "agents/openai.yaml"
      - "plugin.json"
      - "skills/vibe-coding-skill/**"
  schedule:
    - cron: "13 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: .agent-skills-spec
      - name: Install pinned reference validator
        run: python -m pip install ./.agent-skills-spec/skills-ref
      - name: Stage canonical skill under the spec-compliant directory name
        run: |
          mkdir -p /tmp/vibe-coding-skill
          cp SKILL.md /tmp/vibe-coding-skill/SKILL.md
          cp -R references scripts assets /tmp/vibe-coding-skill/
      - name: Validate canonical and portable skill
        run: |
          skills-ref validate /tmp/vibe-coding-skill
          skills-ref validate skills/vibe-coding-skill
