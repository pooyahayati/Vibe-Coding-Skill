name: Release Validated Version

on:
  workflow_run:
    workflows:
      - Validate Skill
      - Cross Platform Smoke
      - Real World Repository Validation
      - Agent Skills Spec Compatibility
      - Tool Contract Tests
      - WordPress Artifact Contract
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build release readiness evidence
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          MAJOR="${VERSION%%.*}"
          if [[ "$VERSION" == *"-beta"* ]]; then
            CHANNEL="beta"
          elif [[ "$VERSION" == *"-rc"* ]] || [[ "$MAJOR" == "0" ]]; then
            CHANNEL="rc"
          else
            CHANNEL="stable"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          python scripts/collect_release_checks.py \
            --repository "$GITHUB_REPOSITORY" --sha "$SHA" \
            --channel "$CHANNEL" --event "$GITHUB_EVENT_PATH" \
            --output /tmp/release-readiness.json

      - name: Enforce release readiness
        if: steps.readiness.outputs.base_ready == 'true'
        shell: bash
        run: |
          args=(
            /tmp/release-readiness.json
            --channel "${{ steps.readiness.outputs.channel }}"
            --json
          )
          python scripts/release_readiness.py "${args[@]}"

      - name: Install native Trivy before publication
        if: steps.readiness.outputs.base_ready == 'true'
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # reviewed v0.2.6
        with:
          version: latest
          cache: false
          path: ${{ runner.temp }}/native-trivy

      - name: Build and verify portable release package
        if: steps.readiness.outputs.base_ready == 'true'
        run: python scripts/build_release.py --output-dir "$RUNNER_TEMP/vibe-release" --before-publication --json

      - name: Create immutable version tag and GitHub Release
        if: steps.readiness.outputs.base_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          python scripts/publish_release.py \
            --repository "$GITHUB_REPOSITORY" --sha "$SHA" --version "$VERSION" \
            --channel "${{ steps.readiness.outputs.channel }}" \
            --output-dir "$RUNNER_TEMP/vibe-release" --recover-draft
