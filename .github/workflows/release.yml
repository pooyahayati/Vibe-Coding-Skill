name: Release Validated Version

on:
  workflow_run:
    workflows:
      - Validate Skill
      - Cross Platform Smoke
      - Real World Repository Validation
      - Agent Skills Spec Compatibility
      - Tool Contract Tests
      - WordPress Artifact Contract
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build release readiness evidence
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          MAJOR="${VERSION%%.*}"
          if [[ "$VERSION" == *"-beta"* ]]; then
            CHANNEL="beta"
          elif [[ "$VERSION" == *"-rc"* ]] || [[ "$MAJOR" == "0" ]]; then
            CHANNEL="rc"
          else
            CHANNEL="stable"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" > /tmp/runs.json

          export VERSION CHANNEL
          python - <<'PY'
          import json
          import os

          data = json.load(open("/tmp/runs.json", encoding="utf-8"))
          sha = os.environ["SHA"]
          baseline = {
              "Validate Skill",
              "Cross Platform Smoke",
              "Real World Repository Validation",
              "Agent Skills Spec Compatibility",
              "Tool Contract Tests",
              "WordPress Artifact Contract",
          }
          wanted = (
              {"Validate Skill"}
              if os.environ["CHANNEL"] == "beta"
              else baseline
          )
          latest = {}
          for run in data.get("workflow_runs", []):
              if (
                  run.get("head_sha") == sha
                  and run.get("head_branch") == "main"
                  and run.get("name") in wanted
              ):
                  item = {
                      "name": run.get("name"),
                      "conclusion": run.get("conclusion"),
                      "commit": run.get("head_sha"),
                      "run_id": run.get("id"),
                  }
                  name = item["name"]
                  current = latest.get(name)
                  if (
                      current is None
                      or int(item.get("run_id") or 0)
                      > int(current.get("run_id") or 0)
                  ):
                      latest[name] = item

          trigger_name = os.environ.get("TRIGGER_NAME", "")
          trigger_conclusion = os.environ.get("TRIGGER_CONCLUSION", "")
          trigger_run_id = int(os.environ.get("TRIGGER_RUN_ID") or 0)
          if trigger_name in wanted and trigger_conclusion:
              current = latest.get(trigger_name)
              trigger_item = {
                  "name": trigger_name,
                  "conclusion": trigger_conclusion,
                  "commit": sha,
                  "run_id": trigger_run_id,
              }
              if (
                  current is None
                  or trigger_run_id >= int(current.get("run_id") or 0)
              ):
                  latest[trigger_name] = trigger_item

          checks = list(latest.values())
          report = {
              "version": os.environ["VERSION"],
              "commit": sha,
              "checks": checks,
          }
          required = wanted
          passed = {
              check["name"]
              for check in checks
              if check.get("conclusion") == "success"
              and check.get("commit") == sha
          }
          base_ready = required.issubset(passed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"base_ready={'true' if base_ready else 'false'}\n")
          with open("/tmp/release-readiness.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2)
              fh.write("\n")
          print(json.dumps({
              "channel": os.environ["CHANNEL"],
              "base_ready": base_ready,
              "required": sorted(required),
              "passed": sorted(passed),
              "report": report,
          }, indent=2))
          PY

      - name: Enforce release readiness
        if: steps.readiness.outputs.base_ready == 'true'
        shell: bash
        run: |
          args=(
            /tmp/release-readiness.json
            --channel "${{ steps.readiness.outputs.channel }}"
            --json
          )
          python scripts/release_readiness.py "${args[@]}"

      - name: Build and verify portable release package
        if: steps.readiness.outputs.base_ready == 'true'
        run: python scripts/build_release.py --output-dir "$RUNNER_TEMP/vibe-release" --json

      - name: Create immutable version tag and GitHub Release
        if: steps.readiness.outputs.base_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          release_args=(
            "$TAG"
            --target "$SHA"
            --title "Vibe Coding Skill $TAG"
            --notes-file "$RUNNER_TEMP/vibe-release/release-notes.md"
          )
          if [ "${{ steps.readiness.outputs.channel }}" != "stable" ]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}" \
            "$RUNNER_TEMP/vibe-release/Vibe-Coding-Skill-${VERSION}.zip" \
            "$RUNNER_TEMP/vibe-release/Vibe-Coding-Skill-${VERSION}-SHA256SUMS.txt"
