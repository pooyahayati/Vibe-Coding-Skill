name: Trivy Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 3"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test latest stable Trivy compatibility
        run: python scripts/trivy_compat.py --latest --json | tee trivy-compat.json
      - name: Verify last-known-good fallback
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["trivy"]["last_known_good"])')
          python scripts/trivy_compat.py --version "$VERSION" --json | tee trivy-fallback.json
      - name: Verify resolver policy
        run: python scripts/toolchain_resolution.py trivy --json
