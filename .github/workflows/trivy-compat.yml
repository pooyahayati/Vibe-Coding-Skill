name: Trivy Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/toolchain.json"
      - "scripts/trivy_compat.py"
      - "scripts/toolchain_resolution.py"
      - ".github/workflows/trivy-compat.yml"
  schedule:
    - cron: "29 5 * * 3"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test latest stable trivy compatibility
        run: python scripts/trivy_compat.py --latest --json | tee trivy-compat.json
      - name: Verify last-known-good fallback
        run: python scripts/trivy_compat.py --version "$(python -c 'import json; print(json.load(open("config/toolchain.json"))["trivy"]["last_known_good"])')" --json | tee trivy-fallback.json

          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["trivy"]["approved"])')
          BRANCH="bot/trivy-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add config/toolchain.json
          git commit -m "chore: approve Trivy ${VERSION}"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: approve Trivy ${VERSION}" \
            --body "Automated compatibility contract tests passed for Trivy ${VERSION}. Merging this PR makes it the approved stable version for Vibe Coding Skill." \
            || true
