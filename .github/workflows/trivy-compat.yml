name: Trivy Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 3"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test latest stable Trivy
        run: python scripts/trivy_compat.py --latest --update-approved --json | tee trivy-compat.json
      - name: Detect toolchain change
        id: change
        shell: bash
        run: |
          if git diff --quiet -- config/toolchain.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Propose approved Trivy update
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("config/toolchain.json"))["trivy"]["approved"])')
          BRANCH="bot/trivy-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add config/toolchain.json
          git commit -m "chore: approve Trivy ${VERSION}"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: approve Trivy ${VERSION}" \
            --body "Automated compatibility contract tests passed for Trivy ${VERSION}. Merging this PR makes it the approved stable version for Vibe Coding Skill." \
            || true
